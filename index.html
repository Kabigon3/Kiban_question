<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important} *{box-sizing:border-box}</style>
<title>基板 質疑応答サーチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, sticky search bar on top, answer cards below — made for a phone right before the talk */
:root {
  --bg: #fbfcfa; --surface: #ffffff; --fg: #18211d; --sub: #5b6862; --line: #d9e0db;
  --copper: #a8541f; --copper-soft: #f6e7dc; --mask: #1f5a43; --mask-soft: #e2efe8;
  --l1: #2f7a52; --l2: #9a6a00; --l3: #b23a1e; --mark: #ffe7a3;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }

header h1 { font-size: 1.45rem; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--sub); font-size: .85rem; }
.trace { height: 3px; width: 64px; background: var(--copper); border-radius: 2px; margin: 10px 0 0; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 0 6px 0 14px; }
.search:focus-within { border-color: var(--copper); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 1.05rem; padding: 12px 0; outline: none; }
.search button { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: .85rem; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.search button:hover { background: var(--mask-soft); }

.row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: .82rem; padding: 3px 11px; border-radius: 999px; cursor: pointer; }
.chip:hover { border-color: var(--copper); }
.chip[aria-pressed="true"] { background: var(--mask); border-color: var(--mask); color: var(--surface); }
.chip:focus-visible, .search button:focus-visible, .copy:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.lvl-chip[data-l="初級"][aria-pressed="true"] { background: var(--l1); border-color: var(--l1); }
.lvl-chip[data-l="中級"][aria-pressed="true"] { background: var(--l2); border-color: var(--l2); }
.lvl-chip[data-l="教授"][aria-pressed="true"] { background: var(--l3); border-color: var(--l3); }
.words { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; scrollbar-width: none; }
.words .chip { white-space: nowrap; background: transparent; }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.tab { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: .82rem; font-weight: 500; padding: 7px 4px; border-radius: 8px; cursor: pointer; line-height: 1.3; }
.tab[aria-selected="true"] { background: var(--copper); color: var(--surface); font-weight: 700; }
.tab:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.catb { font-size: .72rem; color: var(--copper); border: 1px solid var(--copper); padding: 0 6px; border-radius: 4px; }
.count { color: var(--sub); font-size: .8rem; font-variant-numeric: tabular-nums; }

.list { display: grid; gap: 12px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lvl { font-size: .72rem; font-weight: 700; color: var(--surface); padding: 1px 8px; border-radius: 4px; letter-spacing: .04em; }
.lvl.初級 { background: var(--l1); } .lvl.中級 { background: var(--l2); } .lvl.教授 { background: var(--l3); }
.slide { font-family: var(--font-mono); font-size: .72rem; color: var(--sub); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; }
.q { font-weight: 700; font-size: 1.02rem; line-height: 1.55; }
.a { background: var(--mask-soft); border-left: 3px solid var(--mask); padding: 8px 12px; border-radius: 0 8px 8px 0; }
.a-label { font-size: .7rem; color: var(--mask); font-weight: 700; letter-spacing: .08em; }
.hint { color: var(--sub); font-size: .85rem; }
.hint::before { content: "補足　"; color: var(--copper); font-weight: 700; font-size: .75rem; }
.copy { justify-self: start; border: 1px solid var(--line); background: transparent; color: var(--sub); font: inherit; font-size: .75rem; padding: 2px 10px; border-radius: 6px; cursor: pointer; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
sup { font-size: .7em; }

.empty { background: var(--copper-soft); border-radius: 12px; padding: 16px; }
.empty h2 { font-size: 1rem; margin: 0 0 6px; }
.empty ul { margin: 6px 0 0; padding-left: 1.2em; }
footer { margin-top: 28px; color: var(--sub); font-size: .75rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.top { display: grid; grid-template-columns: minmax(0, 1fr) 124px; gap: 12px; align-items: start; }
.qwrap { display: grid; gap: 6px; min-width: 0; }
.thumb { border: 1px solid var(--line); background: var(--surface); padding: 0; border-radius: 6px; overflow: hidden; cursor: zoom-in; display: grid; position: relative; }
.thumb img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
.thumb .slide { position: absolute; right: 4px; bottom: 4px; background: var(--surface); }
.thumb:hover { border-color: var(--copper); }
.thumb:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(16, 22, 19, .82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb-box { width: min(1100px, 100%); display: grid; gap: 10px; }
.lb-box img { width: 100%; height: auto; border-radius: 8px; background: #fff; }
.lb-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #fff; }
.lb-bar button { border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; font: inherit; font-size: .85rem; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.lb-bar .num { font-family: var(--font-mono); font-size: .9rem; }
@media (max-width: 380px) { .top { grid-template-columns: minmax(0, 1fr) 100px; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>基板 質疑応答サーチ</h1>
    <p>17）基板　分野を選んで単語を入れると、関係する想定質問と答え方が出ます</p>
    <div class="trace"></div>
  </header>

  <div class="bar">
    <label class="search" for="q">
      <input id="q" type="text" placeholder="例：ベタ、停動電流、IPC、往復" autocomplete="off" enterkeyhint="search">
      <button id="clear" type="button" hidden>クリア</button>
    </label>
    <div class="tabs" id="cats" role="tablist" aria-label="分野">
      <button class="tab" role="tab" data-c="" aria-selected="true">すべて</button>
      <button class="tab" role="tab" data-c="配線幅" aria-selected="false">配線幅</button>
      <button class="tab" role="tab" data-c="ユニバーサル基板" aria-selected="false">ユニバーサル基板</button>
      <button class="tab" role="tab" data-c="フレキ・プリント" aria-selected="false">フレキ・プリント</button>
    </div>
    <div class="row" id="levels" role="group" aria-label="レベルで絞り込み">
      <button class="chip lvl-chip" data-l="" aria-pressed="true">すべて</button>
      <button class="chip lvl-chip" data-l="初級" aria-pressed="false">初級（学生）</button>
      <button class="chip lvl-chip" data-l="中級" aria-pressed="false">中級</button>
      <button class="chip lvl-chip" data-l="教授" aria-pressed="false">教授</button>
    </div>
    <div class="row words" id="words" aria-label="よく出る単語"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <div class="list" id="list"></div>

  <div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="スライド">
    <div class="lb-box">
      <img id="lbimg" alt="">
      <div class="lb-bar">
        <button id="lbprev" type="button">← 前</button>
        <span class="num" id="lbnum"></span>
        <button id="lbnext" type="button">次 →</button>
        <button id="lbclose" type="button">閉じる</button>
      </div>
    </div>
  </div>

  <footer>パワポ全27枚の内容から作成。配線幅の数値は IPC-2221 の近似式（外層 k＝0.048、内層 k＝0.024）と銅の抵抗率 1.72×10⁻⁸ Ω·m（20℃）で計算。答えは目安です。理解していないことは「確認して後でお答えします」でOK。</footer>
</div>

<script>
const DATA = [{"level": "初級", "q": "oz（オンス）って何ですか？", "slide": 3, "a": "銅箔の厚さを重さで表す単位です。1平方フィートに銅1オンスを広げた厚さで、約35 µmです。", "hint": "2 oz ＝ 約70 µm。基板メーカーの注文画面で選べる。", "k": "oz オンス 銅箔 厚さ 35 単位", "cat": "配線幅"}, {"level": "初級", "q": "mil（ミル）って何ですか？", "slide": 18, "a": "1000分の1インチで、約0.0254 mmです。IPCがアメリカの規格なので、式ではこの単位を使います。", "hint": "", "k": "mil ミル インチ 単位", "cat": "配線幅"}, {"level": "初級", "q": "全部太くすればいいのでは？", "slide": 19, "a": "基板の面積が足りなくなるのと、太すぎると熱が逃げてはんだが付きにくくなるので、必要な分だけ太くします。", "hint": "配線どうしの間隔（クリアランス）も取れなくなる。", "k": "太く 太い 面積 クリアランス", "cat": "配線幅"}, {"level": "初級", "q": "停動電流って何ですか？", "slide": 24, "a": "モータの軸を止めたとき（ロック時）に流れる電流で、モータに流れる一番大きい電流です。データシートに書いてあります。", "hint": "動き出す瞬間もこれに近い電流が流れる。", "k": "停動電流 ロック 起動 モータ", "cat": "配線幅"}, {"level": "初級", "q": "なぜ配線に銅を使うの？", "slide": 17, "a": "電気を通しやすく（抵抗率が小さく）、加工しやすくて安いからです。", "hint": "銀の方が少し通しやすいが高価。", "k": "銅 抵抗率 材料 銀", "cat": "配線幅"}, {"level": "初級", "q": "ベタ・ビアって何ですか？", "slide": 26, "a": "ベタは、細い線ではなく銅箔を面で広く残す配線です。ビアは、表と裏の配線をつなぐ、内側がめっきされた小さな穴です。", "hint": "", "k": "ベタ ビア 用語", "cat": "配線幅"}, {"level": "初級", "q": "ユニバーサル基板でも関係ありますか？", "slide": 25, "a": "あります。ユニバーサル基板では、配線に使う線材の太さ（AWG）や、はんだを盛る量が配線幅の役割をします。モータの線は太い線にします。", "hint": "例：AWG24 ≒ 0.2 mm²、AWG22 ≒ 0.33 mm²。1 mm幅・35 µmの配線（0.035 mm²）よりずっと太い。", "k": "ユニバーサル基板 AWG 線材 はんだ", "cat": "配線幅"}, {"level": "初級", "q": "幅はどうやって決めて、どう作るの？", "slide": 24, "a": "基板CAD（KiCadなど）で線ごとに幅を設定して、そのデータを基板メーカーに送って作ってもらいます。", "hint": "KiCadでは「ネットクラス」で電源線・信号線ごとに幅を決められる。", "k": "CAD KiCad ネットクラス 作り方", "cat": "配線幅"}, {"level": "初級", "q": "温度上昇10℃って、何℃になるの？", "slide": 24, "a": "周りの温度より10℃高くなるまで許す、という意味です。周りが30℃なら配線は40℃くらいになります。", "hint": "", "k": "温度上昇 ΔT 温度", "cat": "配線幅"}, {"level": "初級", "q": "計算が面倒。簡単な方法は？", "slide": 24, "a": "「PCB trace width calculator」で検索すると、電流と温度上昇を入れるだけで幅が出るWebツールがあります。表1もその目安になります。", "hint": "", "k": "計算ツール calculator 計算", "cat": "配線幅"}, {"level": "中級", "q": "なぜ幅を2倍にしても2倍流せないの？", "slide": 18, "a": "許容電流の式で断面積が0.725乗になっていて、1乗より小さいからです。幅を広げても、熱の逃げ方が断面積に比例して良くなるわけではないためです。", "hint": "式自体は実験データに合わせた近似式なので、「0.725は理論値ではなく実験から決めた値」と言えばOK。", "k": "2倍 1.6倍 0.725 指数 式 比例", "cat": "配線幅"}, {"level": "中級", "q": "銅箔を2 ozにしたらどうなる？", "slide": 24, "a": "断面積が2倍になるので、同じ幅でも約1.65倍流せます。1 mm・ΔT10℃なら約2.4 Aが約4.0 Aになります。", "hint": "式は断面積で決まるので、幅を2倍にしても厚さを2倍にしても同じ扱い。", "k": "2oz 銅箔 厚さ", "cat": "配線幅"}, {"level": "中級", "q": "なぜ内層は半分しか流せないの？", "slide": 18, "a": "内層は空気に触れないので熱が逃げにくく、IPC-2221では係数kを外層の半分（0.024）にしているからです。", "hint": "→ 教授から「本当に半分？」が来る可能性あり（4章の②）。", "k": "内層 外層 多層 半分", "cat": "配線幅"}, {"level": "中級", "q": "表と両面で並列にするとき、ビアは大丈夫？", "slide": 24, "a": "ビアにも流せる電流の限界があるので、大電流ならビアを何個も並べます。", "hint": "ビアは穴の内壁のめっき（約20〜25 µm）が導体。0.3 mmの穴なら断面積は約0.024 mm²で、1 mm幅の配線（0.035 mm²）より小さい。", "k": "ビア 並列 両面 めっき", "cat": "配線幅"}, {"level": "中級", "q": "太すぎてはんだが付かない時の対策は？", "slide": 26, "a": "サーマルリリーフといって、パッドとベタを細い線で十字につなぎ、熱が逃げにくい形にします。", "hint": "", "k": "サーマル サーマルリリーフ はんだ ベタ", "cat": "配線幅"}, {"level": "中級", "q": "安全率1.5〜2倍の根拠は？", "slide": 24, "a": "製造で配線が細くなるばらつき、銅箔の厚さの誤差、周りの温度が上がること、電流の見積もり誤差を見込むためです。決まった値ではなく、よく使われる目安です。", "hint": "", "k": "安全率 余裕 1.5", "cat": "配線幅"}, {"level": "教授", "q": "IPC-2221の式はどこまで信用できる？適用範囲は？", "slide": 18, "a": "古い実験データから作った近似式で、厳しめ（安全側）の値が出るとされています。より新しい規格にIPC-2152があり、基板の厚さや近くのベタ面の影響も考えています。今回は目安として使いました。", "hint": "適用範囲は計算ツール等で「〜35 A、幅〜400 mil、ΔT 10〜100℃、銅箔0.5〜3 oz」とよく示される（細かい数値は無理に言わなくてよい）。", "k": "IPC-2221 IPC-2152 規格 信用 適用範囲", "cat": "配線幅"}, {"level": "教授", "q": "停動電流で設計するのは過剰では？一瞬しか流れないのでは？", "slide": 24, "a": "動き出しの一瞬（数ミリ秒）なら、配線の温度はほとんど上がりません。ただ、ロボットが壁に押し付けられるなど、モータがロックしたまま数秒以上続くと温度が上がるので、停動電流を基準にしました。", "hint": "本当は「ヒューズや電流制限でどこまで流れうるか」を決めて、それに合わせるのが筋。こう付け足すと評価が上がる。", "k": "停動電流 ヒューズ 過剰 ロック", "cat": "配線幅"}, {"level": "教授", "q": "電圧降下、行きだけで計算してない？", "slide": 17, "a": "はい、GNDの戻り線でも同じだけ下がるので、往復で考えると約2倍です。100 mm・1 mm幅・3 Aなら、往復で約0.3 Vです。", "hint": "さらに「GNDが揺れるとマイコンの基準電圧が揺れるので、モータのGNDとマイコンのGNDを分けたり、ベタにしたりする」と言えると強い。", "k": "電圧降下 往復 GND 戻り", "cat": "配線幅"}, {"level": "教授", "q": "PWM駆動のとき、使う電流は平均？", "slide": 24, "a": "発熱は電流の2乗で決まるので、平均値ではなく実効値（RMS）で考えます。", "hint": "モータはコイルで電流がならされるので平均に近いことが多いが、電流の波打ち（リップル）が大きいと実効値＞平均値になる。", "k": "PWM 実効値 RMS 平均 リップル", "cat": "配線幅"}, {"level": "教授", "q": "温度で抵抗は変わらないの？", "slide": 17, "a": "変わります。銅は1℃上がると約0.4％抵抗が増えるので、20℃上がると約8％増えます。今回の計算は20℃での値です。", "hint": "温度係数 約0.0039/℃。", "k": "温度係数 抵抗 温度", "cat": "配線幅"}, {"level": "教授", "q": "温度上昇10〜20℃の根拠は？", "slide": 24, "a": "周りの温度に上昇分を足しても、基板材料や部品、はんだの許容温度に十分余裕を残すためです。ロボットの中は周りの温度自体が上がることもあるので、低めにしています。", "hint": "一般的なFR-4のガラス転移温度（Tg）は約130〜140℃。", "k": "温度上昇 Tg FR-4 根拠", "cat": "配線幅"}, {"level": "教授", "q": "マイコンのリセットは本当に配線のせい？", "slide": 17, "a": "配線だけではなく、電池の内部抵抗やモータのノイズも原因になります。配線を太くするのは対策の1つで、電源を分けたり、コンデンサを入れたりする対策も合わせて行います。", "hint": "「配線幅だけで全部解決」と言い切らないのがポイント。", "k": "リセット マイコン ノイズ 電池 コンデンサ", "cat": "配線幅"}, {"level": "教授", "q": "高い周波数では？表皮効果は？", "slide": 14, "a": "モータのPWM（数十kHz）程度なら、表皮深さは銅箔の厚さより十分大きいので、影響はほぼありません。", "hint": "表皮深さ ≒ 66/√f [mm]。20 kHzで約0.47 mm、1 MHzでも約66 µm（＞35 µm）。", "k": "表皮効果 周波数 高周波", "cat": "配線幅"}, {"level": "教授", "q": "配線の間隔は何で決まる？", "slide": 19, "a": "かかる電圧（絶縁）と製造できる限界で決まります。ロボットのような低い電圧では、製造の限界（0.1〜0.15 mm程度）で決まることが多いです。", "hint": "IPC-2221に電圧ごとの最小間隔の表がある。", "k": "間隔 クリアランス 絶縁 電圧", "cat": "配線幅"}, {"level": "教授", "q": "0.15 Vの低下は、実際に問題になる量？", "slide": 17, "a": "5 V系で約3％、3.3 V系で約4.5％です。往復だと約2倍になり、配線が長かったり電流が大きかったりするとさらに増えるので、電源によっては無視できません。", "hint": "", "k": "電圧降下 0.15 5V 3.3V", "cat": "配線幅"}, {"level": "教授", "q": "式のAをmm²で入れてもいい？", "slide": 18, "a": "いいえ。係数k＝0.048はAをmil²で入れる前提の値なので、mm²のまま入れると間違った値になります。必ずmilに換算します。", "hint": "1 mm幅・35 µm → 39.4 mil × 1.38 mil ≒ 54.3 mil²。", "k": "単位 mil mm2 換算 式", "cat": "配線幅"}, {"level": "教授", "q": "「抵抗成分は周波数にかかわらず一定」は正しい？", "slide": 14, "a": "直流や低い周波数ではそうですが、周波数が高くなると電流が表面に集まる表皮効果で、抵抗は大きくなります。モータのPWM程度なら、ほぼ一定と考えて問題ありません。", "hint": "表皮深さ ≒ 66/√f [mm]。銅箔35 µmより浅くなるのは約3.6 MHz以上。", "k": "表皮効果 周波数 抵抗", "cat": "フレキ・プリント"}, {"level": "教授", "q": "層数の表の「スイッチング周波数」は何の周波数？", "slide": 22, "a": "回路の中で電流をON／OFFする速さで、モータドライバのPWMやスイッチング電源の周波数のことです。速いほどノイズが出やすいので、GNDのプレーン層がある多層基板が有利になります。", "hint": "表の数値は出典サイトの目安。石丸さんの担当部分。", "k": "スイッチング周波数 層数 PWM ノイズ", "cat": "フレキ・プリント"}, {"level": "初級", "q": "浮島って何？なぜ作らないの？", "slide": 26, "a": "どこにもつながっていない、孤立したベタのことです。アンテナのようにノイズを拾ったり出したりするので作りません。", "hint": "GNDにつなぐか、削除する。", "k": "浮島 ベタ ノイズ アンテナ", "cat": "配線幅"}, {"level": "初級", "q": "スルーホールって何？", "slide": 7, "a": "基板にあけた穴の内側をめっきして、表と裏の配線を電気的につないだものです。部品の足を差し込む穴としても使います。", "hint": "部品を差さず、表裏をつなぐだけの小さいものがビア。", "k": "スルーホール ビア 穴 めっき", "cat": "ユニバーサル基板"}, {"level": "初級", "q": "FR-4って何？", "slide": 9, "a": "ガラス繊維の布にエポキシ樹脂をしみ込ませた、基板の材料です。FRは「燃えにくい（Flame Retardant）」という意味です。", "hint": "耐熱・絶縁・強度のバランスが良く、いちばん広く使われている。", "k": "FR-4 材料 ガラスエポキシ", "cat": "フレキ・プリント"}, {"level": "初級", "q": "グラフの数値は実際に測ったの？", "slide": 18, "a": "測定値ではなく、IPC-2221の近似式で計算した値です。外層・銅箔35 µmの条件で計算しています。", "hint": "", "k": "グラフ 実測 計算値", "cat": "配線幅"}, {"level": "中級", "q": "信号線は数mAなのに、なぜ0.2〜0.3 mm？", "slide": 25, "a": "電流だけならもっと細くてもいいのですが、細いほど製造ミスや断線が起きやすいので、確実に作れる太さにしています。", "hint": "作れる最小幅0.1〜0.15 mmより少し余裕を持たせた値。", "k": "信号線 製造 断線", "cat": "配線幅"}, {"level": "中級", "q": "マイコン用電源が0.5 mm以上なのはなぜ？", "slide": 25, "a": "マイコンの電源電圧が下がったり揺れたりすると誤動作するので、電流に対して余裕のある太さにして、電圧降下を小さくしています。", "hint": "表1では0.5 mmで約1.5 A（ΔT10℃）流せる。マイコンの消費電流（数十〜数百mA程度）に対して十分な余裕。", "k": "マイコン 電源", "cat": "配線幅"}, {"level": "中級", "q": "温度上昇10℃と20℃で、なぜ約1.35倍違うの？", "slide": 18, "a": "式で温度上昇ΔTが0.44乗で効くので、2倍にすると 2^0.44≒ 1.36倍になるからです。", "hint": "表1でも 2.4 A → 3.2 A（1 mm）で約1.35倍。", "k": "温度上昇 1.35 0.44", "cat": "配線幅"}, {"level": "中級", "q": "ベタGNDの「リターン経路」って何？", "slide": 26, "a": "電流は行きの線とGNDの帰り道で輪（ループ）を作って流れます。帰り道がベタで信号線の真下にあると、ループが小さくなってノイズが減ります。", "hint": "", "k": "リターン経路 GND ベタ ループ ノイズ", "cat": "配線幅"}, {"level": "中級", "q": "UL94V-0って何？", "slide": 23, "a": "UL94という燃えにくさの規格の等級で、V-0は一番燃えにくいランクです。火を離すとすぐ消えます。", "hint": "VTM-0はフィルムのような薄い材料用の同じランク。", "k": "UL94 難燃性 燃えにくい V-0", "cat": "フレキ・プリント"}, {"level": "中級", "q": "温度変化の繰り返しで、なぜひびが入るの？", "slide": 19, "a": "銅・基板・はんだは、熱で伸びる量がそれぞれ違うので、温まる・冷えるを繰り返すたびに力がかかり、金属疲労でひびが入ります。", "hint": "", "k": "ひび 熱膨張 疲労 温度変化", "cat": "配線幅"}, {"cat": "ユニバーサル基板", "level": "初級", "slide": 3, "q": "ユニバーサル基板って何ですか？", "a": "穴が等間隔にたくさん開いた基板で、部品を自由に差し込んではんだ付けし、回路を作れるものです。", "hint": "専用の基板を作らなくても回路が作れるので、試作によく使う。", "k": "意味 定義 穴"}, {"cat": "ユニバーサル基板", "level": "初級", "slide": 7, "q": "ランドって何ですか？", "a": "穴のまわりにある、はんだを盛るための銅箔の部分です。ここに部品の足をはんだ付けして固定します。", "hint": "両面スルーホールの基板では、ランドは穴の内側のめっき（スルーホール）で表と裏がつながっている。", "k": "ランド 銅箔 はんだ スルーホール"}, {"cat": "ユニバーサル基板", "level": "初級", "slide": 5, "q": "なぜ試作でユニバーサル基板を使うの？", "a": "部品を自由に配置・配線できるので、回路の変更や修正にすぐ対応できるからです。専用の基板を作る手間や費用もかかりません。", "hint": "授業やロボットコンテストでもよく使われる。", "k": "試作 背景 理由 修正 変更"}, {"cat": "ユニバーサル基板", "level": "初級", "slide": 21, "q": "穴の間隔はなぜ2.54 mmなの？", "a": "2.54 mmは0.1インチで、多くのICやピンヘッダ、Arduinoのピンがこの間隔で作られているからです。", "hint": "DIP（足が2列に並んだ）ICもこの間隔。", "k": "2.54 ピッチ 間隔 0.1インチ ピンヘッダ"}, {"cat": "ユニバーサル基板", "level": "初級", "slide": 7, "q": "ブレッドボードとの違いは？", "a": "ブレッドボードははんだ付けなしで抜き差しできますが、接触が不安定で振動に弱いです。ユニバーサル基板ははんだで固定するので、ロボットに載せても外れにくいです。", "hint": "ブレッドボードで動作確認 → ユニバーサル基板で本番、という流れが多い。", "k": "ブレッドボード 違い 振動 はんだ"}, {"cat": "ユニバーサル基板", "level": "初級", "slide": 7, "q": "ユニバーサル基板のメリット・デメリットは？", "a": "メリットは、安く手に入り、回路を自由に作れて、修正や改造がしやすいことです。デメリットは、配線に手間がかかり、配線ミスが起きやすく、大きな回路には向かないことです。", "hint": "", "k": "メリット デメリット 特性 長所 短所"}, {"cat": "ユニバーサル基板", "level": "中級", "slide": 21, "q": "ガラスエポキシとベークライト（紙フェノール）の違いは？", "a": "ガラスエポキシは耐熱性と強度が高く、割れにくく、ランドもはがれにくいです。紙フェノールは安くて加工しやすいですが、割れやすく熱に弱いです。", "hint": "はんだのやり直しが多い初心者やロボットには、ガラスエポキシが向いている。", "k": "材質 ガラスエポキシ ベークライト 紙フェノール 耐熱"}, {"cat": "ユニバーサル基板", "level": "中級", "slide": 7, "q": "片面と両面スルーホールのユニバーサル基板の違いは？", "a": "両面スルーホールは、穴の内側がめっきされて表と裏がつながっています。両面で配線でき、ランドもはがれにくいですが、片面より高価です。", "hint": "", "k": "片面 両面 スルーホール めっき"}, {"cat": "ユニバーサル基板", "level": "中級", "slide": 7, "q": "ユニバーサル基板では配線をどうするの？", "a": "スズメッキ線やジャンパ線で部品どうしをつなぐか、隣どうしのランドをはんだでつなぎます。モータの電源のような大きな電流の線は、太い線を使います。", "hint": "配線の太さの考え方は、配線幅と同じ（線の太さ＝AWG）。", "k": "配線 ジャンパ線 スズメッキ線 はんだブリッジ AWG"}, {"cat": "ユニバーサル基板", "level": "中級", "slide": 21, "q": "基板の大きさはどう選ぶ？", "a": "ロボットの中に収まることと、載せる部品の数で決めます。センサ回路だけなら小さい基板で十分ですが、部品が多いときは大きめを選びます。", "hint": "大きい基板を必要な大きさにカットして使うこともできる。", "k": "大きさ サイズ 選定 部品数"}, {"cat": "ユニバーサル基板", "level": "教授", "slide": 21, "q": "ロボットの振動や衝撃で壊れない？", "a": "はんだ付けの部分やジャンパ線は、振動で疲れて断線することがあります。線を基板に固定したり、部品を根元まで差し込んだり、ロック付きのコネクタを使ったりして対策します。", "hint": "線はホットボンドや結束バンドで固定する。", "k": "振動 衝撃 信頼性 断線 コネクタ"}, {"cat": "ユニバーサル基板", "level": "教授", "slide": 21, "q": "ユニバーサル基板でモータの大きな電流はどう流す？", "a": "ランドの銅箔は薄いので、ランドやはんだのつなぎだけに頼らず、太い線をできるだけ短く配線します。電源とGNDは特に太くします。", "hint": "配線幅の考え方（断面積が大きいほど流せる）がそのまま当てはまる。", "k": "大電流 モータ 太い線 GND"}, {"cat": "ユニバーサル基板", "level": "教授", "slide": 7, "q": "ノイズの面での弱点は？", "a": "プリント基板のようなGNDの面（プレーン）がなく、配線も長くなりがちなので、ノイズに弱いです。GND線を太く短くし、ICのすぐ近くにコンデンサ（パスコン）を置いて対策します。", "hint": "", "k": "ノイズ GND パスコン プレーン"}, {"cat": "ユニバーサル基板", "level": "教授", "slide": 8, "q": "どんなときにプリント基板に切り替える？", "a": "同じ回路をいくつも作るとき、部品が多いとき、小型にしたいとき、高速な信号を扱うとき、信頼性が必要なときです。", "hint": "最近は基板メーカーに安く発注できるので、早めに切り替えることも多い。", "k": "切り替え 移行 プリント基板 量産"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 3, "q": "プリント基板って何ですか？", "a": "電子部品を固定して、銅箔の配線で電気的につなぐための、絶縁体でできた板です。部品を実装したものを指すこともあります。", "hint": "", "k": "意味 定義 プリント基板"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 8, "q": "剛性って何ですか？", "a": "ざっくり言うと、形の変わりにくさです。剛性が高いほど硬くて曲がりにくいです。", "hint": "スライドでは左ほど剛性が高く、右ほど低い順に並べている。", "k": "剛性 硬さ 分類"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 9, "q": "リジッド基板って何ですか？", "a": "硬い基板のことです。絶縁体の板と銅箔を重ねて板状にしたもので、部品を直接固定できます。絶縁体には主にFR-4が使われます。", "hint": "いちばん一般的なプリント基板。", "k": "リジッド 硬い FR-4"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 8, "q": "フレキシブル基板って何ですか？", "a": "薄いフィルムでできた、曲げられるプリント基板です。Flexibleは「曲げやすい、柔軟な」という意味です。", "hint": "", "k": "フレキシブル フレキ FPC 曲げ"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 10, "q": "リジッドフレキシブル基板って何ですか？", "a": "硬いリジッド基板と曲がるフレキシブル基板を、1枚に合体させた基板です。両方の性質を持ちますが、設計も製造も費用がかかります。", "hint": "コネクタやケーブルなしで、基板どうしを折り曲げてつなげる。", "k": "リジッドフレキ 合体 費用"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 15, "q": "フレキシブル基板はどこで使われているの？", "a": "スマホやカメラ、ノートパソコンの開閉部分など、狭い場所や動く部分の配線に使われています。", "hint": "ロボットなら関節や回転する部分の配線に向いている。", "k": "用途 スマホ カメラ 関節"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 11, "q": "層数って何ですか？", "a": "基板の中にある、配線用の銅箔の層の枚数です。層が多いほど配線をたくさん通せて、ノイズにも強くできます。", "hint": "", "k": "層数 層 2層 4層 6層"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 11, "q": "シールド効果って何ですか？", "a": "簡単に言うと、ノイズを防ぐ効果です。GNDの面で信号を囲むことで、外からのノイズや、外へ出るノイズを減らします。", "hint": "", "k": "シールド ノイズ"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 12, "q": "グラウンドプレーンって何ですか？", "a": "基板の1つの層をまるごとGNDのベタにした層です。ノイズを減らし、GNDの電位を安定させます。", "hint": "電源用の層は電源プレーン。", "k": "グラウンドプレーン GND プレーン ベタ"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 11, "q": "2層基板と4層基板の違いは？", "a": "4層基板はGNDと電源の層（プレーン）を持てるので、ノイズに強く、高速な信号も扱えます。2層基板は安いですが、部品が多いと配線しきれず、ノイズにも弱いです。", "hint": "", "k": "2層 4層 違い ノイズ コスト"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 12, "q": "4層が「信号／GND／電源／信号」の並びなのはなぜ？", "a": "信号層のすぐ隣にGNDや電源の面があると、信号の帰り道が信号の真下にでき、ノイズが減るからです。電源も面にすることで、電圧が安定します。", "hint": "", "k": "4層 構成 信号層 GND 電源 並び"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 13, "q": "6層基板にすると何が良くなる？", "a": "信号層をGNDの層で挟めるので、信号どうしの干渉（ノイズ）を4層よりさらに減らせます。その分、値段は高くなります。", "hint": "", "k": "6層 干渉 ノイズ 値段"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 9, "q": "片面プリント配線板はどんな回路に向いているの？", "a": "足を穴に差し込むタイプ（ディップ型）の部品が多い回路に向いています。主な用途はテレビやオーディオなどのアナログ回路です。", "hint": "", "k": "片面 ディップ アナログ"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 9, "q": "両面メッキスルーホール基板の特徴は？", "a": "穴の内側が銅メッキされていて、表と裏の配線がつながっています。電気が流れやすく抵抗値が低いので、使う環境が厳しい電子機器に広く使われています。", "hint": "", "k": "両面 メッキ スルーホール"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 23, "q": "ポリイミドとポリエステルの違いは？", "a": "ポリイミドは熱に強く、はんだ付けができますが、高価で水を吸いやすいです。ポリエステルは非常に安いですが、熱に弱く、はんだ付けが難しいです。", "hint": "フレキシブル基板の材料としては、はんだ付けできるポリイミドが主流。", "k": "ポリイミド ポリエステル 材料 耐熱"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 16, "q": "フレキシブル基板の短所は？", "a": "値段が高いこと（生板でリジッドの約3〜8倍）、外力ではんだ付け部分が壊れやすいこと、納期が長いこと（2層リジッドで約3日、フレキで約5日〜2週間）です。", "hint": "", "k": "短所 価格 納期 外力"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 16, "q": "外力に弱い対策は？", "a": "専用のプラスチックケースや、基板をはめ込む溝をあらかじめ作っておきます。", "hint": "部品やコネクタの裏に、硬い補強板（スティフナー）を貼る方法もよく使われる。", "k": "対策 ケース 溝 補強板 スティフナー"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 15, "q": "屈曲寿命「1億回以上」は、どんな曲げ方でも？", "a": "いいえ、曲げる半径や動かし方で変わります。小さく急に曲げるほど寿命は短くなるので、なるべく大きな半径で曲がるように設計します。", "hint": "", "k": "屈曲寿命 1億回 曲げ半径"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 22, "q": "層数を電流で決めるのは正しい？", "a": "層を増やすと電源やGNDの面を作れるので、大きな電流やノイズに有利、という考え方です。ただ、電流だけなら配線幅や銅箔の厚さ、ベタでも対応できるので、層数はノイズや配線の混み具合と合わせて決めます。", "hint": "スライドにも「電流値・ノイズ要求・回路の複雑度を総合して判断」とある。", "k": "層数 電流 10A 50A 選定"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 12, "q": "高い周波数を扱うと、なぜ層数を増やすの？", "a": "高い周波数ほどノイズが出やすく、拾いやすいからです。GNDの層を信号の隣に入れると、信号の帰り道が真下にでき、ノイズの放射や干渉を減らせます。", "hint": "", "k": "高周波 層数 ノイズ GND"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 14, "q": "信号の損失が配線の長さに比例するのはなぜ？", "a": "配線の抵抗が長さに比例するので、抵抗による損失も長さに比例します。", "hint": "高い周波数では、表皮効果や基板材料による損失（誘電損失）も周波数とともに増える。", "k": "損失 長さ 比例 抵抗"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 9, "q": "なぜFR-4が広く使われているの？", "a": "耐熱性、絶縁性、強度のバランスが良く、値段も安いからです。", "hint": "とても高い周波数では損失が大きくなるので、専用の材料を使うこともある。", "k": "FR-4 理由 耐熱 絶縁"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 15, "q": "曲げても銅箔が割れないのはなぜ？", "a": "フレキシブル基板には、曲げに強い圧延銅箔がよく使われているからです。", "hint": "圧延銅箔は、電気めっきで作る電解銅箔より曲げに強い。", "k": "銅箔 割れ 圧延 屈曲"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 10, "q": "リジッドフレキが高いのはなぜ？", "a": "硬い材料と柔らかい材料を重ねて作るので、製造の工程が多く複雑になるからです。設計にも手間がかかります。", "hint": "", "k": "リジッドフレキ 価格 高い 製造"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 13, "q": "多層基板が偶数の層数なのはなぜ？", "a": "上下で同じ構造（対称）にしないと、熱で基板が反ってしまうからです。そのため2層・4層・6層のような偶数が一般的です。", "hint": "", "k": "偶数 層数 反り 対称"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 8, "q": "リジッド・フレキ・リジッドフレキは、どうやって選ぶの？", "a": "動かない場所で部品をしっかり載せるならリジッド、曲げたい場所や動く部分、狭い場所ならフレキ、その両方を1枚でつなぎたいならリジッドフレキを選びます。基本はリジッドで、必要なところだけフレキを使います。", "hint": "形（曲げる必要があるか）、動き、部品の重さ、値段、納期で決める。", "k": "選定 選び方 種類 リジッド フレキ リジッドフレキ"}, {"cat": "フレキ・プリント", "level": "初級", "slide": 8, "q": "実習のロボットならどれを選ぶ？", "a": "基本はリジッド基板です。安くて納期も短く、部品をしっかり固定できるからです。関節や回転する部分の配線だけ、フレキやケーブルを使います。", "hint": "", "k": "選定 選び方 種類 実習 ロボット リジッド"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 15, "q": "フレキの代わりに、普通のケーブルではだめ？", "a": "多くの場合はケーブルとコネクタで十分で、そのほうが安いです。フレキを選ぶのは、とても狭い場所、何万回も曲げる場所、軽く薄くしたい場所です。", "hint": "", "k": "選定 選び方 種類 ケーブル コネクタ 代わり"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 10, "q": "リジッドフレキを選ぶのはどんなとき？", "a": "コネクタやケーブルを減らして接触不良をなくしたいときや、基板を立体的に折りたたんで小さくしたいときです。ただし、設計も製造も高くなります。", "hint": "スマホやカメラのような小さく高密度な機器で使われる。", "k": "選定 選び方 種類 リジッドフレキ コネクタ 小型化"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 23, "q": "フレキの材料はどう選ぶ？", "a": "部品をはんだ付けするなら、熱に強いポリイミドを選びます。はんだ付けをせず、とにかく安くしたい場合はポリエステルを選びます。", "hint": "", "k": "選定 選び方 種類 材料 ポリイミド ポリエステル はんだ"}, {"cat": "フレキ・プリント", "level": "中級", "slide": 23, "q": "フレキの厚さはどう選ぶ？", "a": "薄いほど曲げやすく、繰り返し曲げても壊れにくいです。厚いと丈夫ですが曲げにくくなります。繰り返し曲げる部分は、薄くするのが基本です。", "hint": "", "k": "選定 選び方 種類 厚さ 薄い 曲げやすさ"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 15, "q": "曲げる回数で選び方は変わる？", "a": "変わります。組み立てるときに一度曲げるだけか、動いている間ずっと繰り返し曲げるかで違います。繰り返し曲げるなら、片面で薄くし、曲げに強い圧延銅箔を使い、曲げ半径を大きく取ります。", "hint": "一度だけ曲げる使い方は静的、繰り返し曲げる使い方は動的と呼ぶ。", "k": "選定 選び方 種類 屈曲 回数 静的 動的 曲げ半径"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 16, "q": "値段と納期で見ると、選び方はどうなる？", "a": "フレキは生板でリジッドの約3〜8倍高く、納期も2層リジッドの約3日に対して約5日〜2週間かかります。何度も作り直す試作では、リジッドが有利です。", "hint": "", "k": "選定 選び方 種類 値段 納期 コスト 試作"}, {"cat": "フレキ・プリント", "level": "教授", "slide": 16, "q": "フレキに重い部品を載せるとどうなる？", "a": "部品の重さで基板が曲がり、はんだ付けの部分に力がかかって壊れやすくなります。重い部品はリジッド側に載せるか、裏に補強板を貼ります。", "hint": "", "k": "選定 選び方 種類 重い部品 補強板 はんだ"}];
const WORDS = {
  "": ["ノイズ","GND","ベタ","スルーホール","はんだ","FR-4","層数","IPC","停動電流","材料","値段"],
  "配線幅": ["ベタ","ビア","停動電流","電圧降下","IPC","内層","表皮効果","安全率","oz","mil","温度上昇","PWM","マイコン","2倍"],
  "ユニバーサル基板": ["ランド","2.54","材質","ブレッドボード","振動","大電流","ノイズ","配線","メリット","スルーホール"],
  "フレキ・プリント": ["選び方","剛性","リジッド","層数","4層","6層","GND","シールド","ポリイミド","価格","納期","屈曲","FR-4","周波数"]
};

const $ = (id) => document.getElementById(id);
const norm = (s) => (s || "").normalize("NFKC").toLowerCase()
  .replace(/[ァ-ヶ]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60))
  .replace(/\s+/g, "");
const ALIAS = { "おんす": "oz", "みる": "mil", "べたぱたーん": "ベタ", "ぐらうんど": "gnd", "あーす": "gnd", "てい動電流": "停動電流", "ろっく": "停動電流" };

DATA.forEach((d, i) => { d.id = i; d.hay = norm([d.q, d.a, d.hint, d.k, d.level, d.cat, d.slide ? "p" + d.slide : ""].join(" ")); });

let level = "", cat = "";
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function render(text, terms) {
  let h = esc(text).replace(/\^([0-9.]+)/g, "<sup>$1</sup>");
  if (!terms.length) return h;
  // 表示用：元の文字列の中で、正規化すると一致する部分にマーク
  const raw = text;
  const marks = [];
  terms.forEach((t) => {
    for (let s = 0; s < raw.length; s++) for (let e = s + 1; e <= Math.min(raw.length, s + t.length + 4); e++) {
      if (norm(raw.slice(s, e)) === t) { marks.push([s, e]); s = e - 1; break; }
    }
  });
  if (!marks.length) return h;
  marks.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  marks.forEach(([s, e]) => { if (s < pos) return; out += esc(raw.slice(pos, s)) + "<mark>" + esc(raw.slice(s, e)) + "</mark>"; pos = e; });
  out += esc(raw.slice(pos));
  return out.replace(/\^([0-9.]+)/g, "<sup>$1</sup>");
}

function update() {
  const raw = $("q").value;
  $("clear").hidden = !raw;
  const terms = raw.split(/[\s、,]+/).map(norm).filter(Boolean).map((t) => norm(ALIAS[t] || t));
  const hits = DATA.filter((d) => (!cat || d.cat === cat) && (!level || d.level === level) && terms.every((t) => d.hay.includes(t)));
  const order = { "教授": 0, "中級": 1, "初級": 2 };
  if (terms.length) hits.sort((a, b) => (b.q.includes(raw) ? 1 : 0) - (a.q.includes(raw) ? 1 : 0) || order[a.level] - order[b.level]);
  const pool = DATA.filter((d) => !cat || d.cat === cat).length;
  $("count").textContent = terms.length || level ? `${hits.length} 件ヒット（${cat || "全分野"} ${pool} 問中）` : `${cat || "全分野"} ${pool} 問`;
  const list = $("list");
  if (!hits.length) {
    list.innerHTML = `<div class="empty"><h2>「${esc(raw)}」に関係する質問は見つかりませんでした</h2>
      別の言い方（例：「GND」→「グラウンド」）でも探してみてください。それでも出ない質問が来たら：
      <ul><li>「そこまでは調べきれていないので、確認して後でお答えします」</li>
      <li>「今回はIPC-2221の近似式を目安として使いました。より正確にはIPC-2152を使うべきだと考えています」</li></ul></div>`;
    return;
  }
  list.innerHTML = hits.map((d) => `
    <article class="card">
      <div class="top">
        <div class="qwrap">
          <div class="meta"><span class="lvl ${d.level}">${d.level}</span>${cat ? "" : `<span class="catb">${d.cat}</span>`}</div>
          <div class="q">${render(d.q, terms)}</div>
        </div>
        ${d.slide ? `<button class="thumb" type="button" data-s="${d.slide}" aria-label="スライド p.${d.slide} を大きく表示"><img src="slides/slide-${d.slide}.jpg" alt="" loading="lazy" width="1100" height="619"><span class="slide">p.${d.slide}</span></button>` : ""}
      </div>
      <div class="a"><div class="a-label">そのまま言える答え</div>${render(d.a, terms)}</div>
      ${d.hint ? `<div class="hint">${render(d.hint, terms)}</div>` : ""}
      <button class="copy" type="button" data-id="${d.id}">答えをコピー</button>
    </article>`).join("");
}

const SLIDES = 27;
let cur = 1;
function openSlide(n) {
  cur = Math.min(SLIDES, Math.max(1, n));
  $("lbimg").src = `slides/slide-${cur}.jpg`;
  $("lbimg").alt = `発表スライド p.${cur}`;
  $("lbnum").textContent = `p.${cur} / ${SLIDES}`;
  $("lb").hidden = false;
}
const closeSlide = () => { $("lb").hidden = true; };
$("lbprev").addEventListener("click", () => openSlide(cur - 1));
$("lbnext").addEventListener("click", () => openSlide(cur + 1));
$("lbclose").addEventListener("click", closeSlide);
$("lb").addEventListener("click", (e) => { if (e.target.id === "lb") closeSlide(); });
document.addEventListener("keydown", (e) => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeSlide();
  if (e.key === "ArrowLeft") openSlide(cur - 1);
  if (e.key === "ArrowRight") openSlide(cur + 1);
});

function drawWords() { $("words").innerHTML = WORDS[cat].map((w) => `<button class="chip" type="button" data-w="${w}">${w}</button>`).join(""); }
drawWords();
$("cats").addEventListener("click", (e) => {
  const b = e.target.closest("[data-c]"); if (!b) return;
  cat = b.dataset.c;
  document.querySelectorAll(".tab").forEach((c) => c.setAttribute("aria-selected", String(c === b)));
  drawWords(); update();
});
$("words").addEventListener("click", (e) => { const b = e.target.closest("[data-w]"); if (!b) return; $("q").value = b.dataset.w; update(); });
$("levels").addEventListener("click", (e) => {
  const b = e.target.closest("[data-l]"); if (!b) return;
  level = b.dataset.l;
  document.querySelectorAll(".lvl-chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
  update();
});
$("q").addEventListener("input", update);
$("clear").addEventListener("click", () => { $("q").value = ""; update(); $("q").focus(); });
$("list").addEventListener("click", (e) => {
  const th = e.target.closest(".thumb"); if (th) { openSlide(+th.dataset.s); return; }
  const b = e.target.closest(".copy"); if (!b) return;
  const d = DATA[+b.dataset.id];
  const done = () => { b.textContent = "コピーしました"; setTimeout(() => (b.textContent = "答えをコピー"), 1500); };
  try { navigator.clipboard.writeText(d.a.replace(/\^/g, "")).then(done, () => {}); } catch (_) {}
});

$("q").value = "ノイズ";
update();
</script>

</body>
</html>
